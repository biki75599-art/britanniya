<body>

<div class="fixed bottom-0 left-0 w-full z-50 flex justify-center">

</button>

    </div>
    </div>
        
<script>
(async function loadRechargeHistory() {
    const token = localStorage.getItem("token");
    const list = document.getElementById("historyList");

    if (!token) {
        window.location.href = "login.html";
        return;
    }

    try {
        const response = await fetch(
            "https://mygame-backend.sohitking478.workers.dev/api/recharge/history",
            {
                method: "GET",
                headers: {
                    "Accept": "application/json",
                    "Authorization": "Bearer " + token
                },
                cache: "no-store"
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to load recharge history");
        }

        const history = Array.isArray(data.history) ? data.history : [];

        let totalRecharge = 0;
        let todayRecharge = 0;
        let successCount = 0;

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        if (history.length === 0) {
            list.innerHTML = '<div class="history-item">No Recharge Found</div>';
        } else {
            list.innerHTML = history.map(item => {
                const amount = Number(item.amount || 0);
                const status = String(item.status || "Pending");
                const dateObject = item.createdAt ? new Date(item.createdAt) : null;
                const date = dateObject && !Number.isNaN(dateObject.getTime())
                    ? dateObject.toLocaleString()
                    : "";

                if (status === "Approved") {
                    totalRecharge += amount;
                    successCount++;

                    if (dateObject && dateObject >= today) {
                        todayRecharge += amount;
                    }
                }

                const cls = status.toLowerCase();

                return `
                    <div class="history-item">
                        <div>
                            <b>Recharge</b><br>
                            <small style="color:#888">${date}</small>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-weight:bold;">₹${amount}</div>
                            <div class="badge ${cls}">${status}</div>
                        </div>
                    </div>`;
            }).join("");
        }

        const totalElement = document.getElementById("totalRecharge");
        const todayElement = document.getElementById("todayRecharge");
        const countElement = document.getElementById("successCount");

        if (totalElement) totalElement.innerText = "₹" + totalRecharge;
        if (todayElement) todayElement.innerText = "₹" + todayRecharge;
        if (countElement) countElement.innerText = successCount;

    } catch (error) {
        console.error("Error loading recharge history:", error);
        list.innerHTML = '<div class="history-item">Unable to load recharge history</div>';
    }
})();
</script>
